<style>
  :root{
    --bg: #100E17;
    --surface: #1A1826;
    --surface-alt: #221F30;
    --border: #322D42;
    --text: #EDEBF4;
    --text-soft: #9490A6;
    --accent: #D9A441;
    --accent-dark: #B8872F;
    --accent-2: #7C6CE0;
    --accent-text: #14161A;
    --green: #4CAF6D;
    --green-bg: rgba(76,175,109,0.14);
    --red: #E0605A;
    --red-bg: rgba(224,96,90,0.14);
    --vacation: #7CA0D9;
    --vacation-bg: rgba(124,160,217,0.14);
    --shadow: 0 8px 24px rgba(0,0,0,0.28);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.22);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(124,108,224,0.12), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(217,164,65,0.08), transparent 40%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 18px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--border);
  }
  .header-actions-col{ display:flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .header-actions{ display:flex; gap: 8px; }
  .icon-btn.sync-active{ border-color: var(--accent); color: var(--accent); }
  .sync-error-text{ color: var(--red) !important; }
  .sync-status{
    font-size: 10.5px;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .sync-status.sync-status-error{ color: var(--red); }
  h1{
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 5px;
  }
  button.icon-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  button.icon-btn:hover{ border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  /* Punch card (Kommen/Gehen) */
  .punch-card{
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .punch-label{ font-size: 12.5px; color: var(--text-soft); margin-bottom: 6px; }
  .punch-times{ display:flex; gap: 16px; flex-wrap: wrap; }
  .punch-time{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .punch-time-empty{ font-size: 13px; color: var(--text-soft); }
  .punch-timer{
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
  }
  .punch-timer.timer-over{ color: var(--green); }
  .punch-done-hint{

<script>
const STORAGE_KEY = 'zeitkonto_v1';

const MONTH_SHORT = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const TABS = [
  { id: 'ueberstunden', label: 'Überstunden' },

];

const todayObj = new Date();
const todayStr = fmtDate(todayObj);

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function weekdayMon0(d){ return (d.getDay()+6)%7; } // 0=Mon..6=Sun

/* Gesetzliche Feiertage Österreich (gelten auch für Niederösterreich – */
/* Österreich hat keine bundesländerspezifischen Feiertage). */
const _holidayCache = {};

function easterSunday(year){
  const a = year % 19;
  const b = Math.floor(year/100);
  const c = year % 100;
  const d = Math.floor(b/4);
  const e = b % 4;
  const f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4);
  const k = c%4;
  const l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function addDays(date, days){ const d = new Date(date); d.setDate(d.getDate()+days); return d; }

function holidaysForYear(year){
  const easter = easterSunday(year);
  const list = [
    { date: new Date(year,0,1),  name: 'Neujahr' },

    { date: addDays(easter,1),   name: 'Ostermontag' },
    { date: new Date(year,4,1),  name: 'Staatsfeiertag' },
    { date: addDays(easter,39),  name: 'Christi Himmelfahrt' },
    { date: addDays(easter,50),  name: 'Pfingstmontag' },
    { date: addDays(easter,60),  name: 'Fronleichnam' },
    { date: new Date(year,7,15), name: 'Mariä Himmelfahrt' },
    { date: new Date(year,9,26), name: 'Nationalfeiertag' },
    { date: new Date(year,10,1), name: 'Allerheiligen' },
    { date: new Date(year,11,8), name: 'Mariä Empfängnis' },
    { date: new Date(year,11,24),name: 'Heiliger Abend' },
    { date: new Date(year,11,25),name: 'Christtag' },
    { date: new Date(year,11,26),name: 'Stefanitag' },
    { date: new Date(year,11,31),name: 'Silvester' }
  ];
  const map = {};
  list.forEach(h => { map[fmtDate(h.date)] = h.name; });
  return map;
}
function getHolidaysForYear(year){
  if(!_holidayCache[year]) _holidayCache[year] = holidaysForYear(year);
  return _holidayCache[year];
}
function holidayName(dateStr){
  const year = Number(dateStr.slice(0,4));
  return getHolidaysForYear(year)[dateStr] || null;
}

function sollMinutes(dateStr){
  if(holidayName(dateStr)) return 0;   // gesetzlicher Feiertag
  const d = parseDate(dateStr);
  const wd = weekdayMon0(d); // 0..6
  if(wd>=0 && wd<=3) return 8*60;      // Mo-Do
  if(wd===4) return 6.5*60;            // Fr
  return 0;                            // Sa/So
}

function timerDurationMinutes(dateStr){
  // Anwesenheitszeit inkl. 15 Min Pause: Mo-Do 8:15 Std, Fr 6:45 Std
  if(holidayName(dateStr)) return null;
  const d = parseDate(dateStr);
  const wd = weekdayMon0(d);
  if(wd>=0 && wd<=3) return 8*60 + 15;
  if(wd===4) return 6*60 + 45;
  return null;
}

function timeToMin(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function workedMinutes(entry){
  const s = timeToMin(entry.start), e = timeToMin(entry.end);
  if(s===null || e===null) return null;
  const brk = Number(entry.breakMin)||0;
  const w = (e - s) - brk;
  return w;
}

function fmtDuration(min){
  const sign = min < 0 ? '-' : (min > 0 ? '+' : '');
  const abs = Math.abs(Math.round(min));
  const h = Math.floor(abs/60), m = abs%60;
  return `${sign}${h}:${pad(m)}`;
}
function fmtDurationPlain(min){
  const abs = Math.abs(Math.round(min));
  const h = Math.floor(abs/60), m = abs%60;
  return `${h}:${pad(m)}`;
}

function defaultState(){

async function loadState(){
  let migrated = false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(defaultState(), parsed);
      state.settings = Object.assign(defaultState().settings, parsed.settings||{});
      state.entries = parsed.entries || {};

      // Einmalige Korrektur: Anfangssaldo auf 14,25 Std setzen, falls noch nicht manuell gesetzt.
      if(!state.settings._startBalanceSeeded){
        state.settings.startBalanceMinutes = 855;
        state.settings._startBalanceSeeded = true;

    }
  } catch(err){
    console.error('Fehler beim Laden:', err);
    state = defaultState();
    state.settings._startBalanceSeeded = true;
    loadError = true;
  }
  return migrated;
}

async function saveState(){

    loadError = false;
  } catch(err){

/* ---------- Cloud-Sync (GitHub Gist) ---------- */

const SYNC_FILENAME = 'zeitsaldo-sync.json';

function buildSyncPayload(){
  const { syncToken, syncGistId, ...restSettings } = state.settings;
  return { settings: restSettings, entries: state.entries };
}

async function githubFetch(url, method, body){
  const res = await fetch(url, {
    method,
    headers: {
      'Authorization': `token ${state.settings.syncToken}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`GitHub API Fehler (${res.status}): ${text}`);
  }
  return res.json();
}

async function pushToGist(){
  if(!state.settings.syncToken) return;
  syncStatus = 'saving';
  try{
    const payload = JSON.stringify(buildSyncPayload(), null, 2);
    if(state.settings.syncGistId){
      await githubFetch(`https://api.github.com/gists/${state.settings.syncGistId}`, 'PATCH', {
        files: { [SYNC_FILENAME]: { content: payload } }
      });
    } else {
      const result = await githubFetch('https://api.github.com/gists', 'POST', {
        description: 'Zeitsaldo Sync – bitte nicht löschen',
        public: false,
        files: { [SYNC_FILENAME]: { content: payload } }
      });
      state.settings.syncGistId = result.id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    syncStatus = 'ok';
    syncMessage = `Zuletzt synchronisiert: ${new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})}`;
  } catch(err){
    console.error('Sync-Fehler (Upload):', err);
    syncStatus = 'error';
    syncMessage = 'Hochladen fehlgeschlagen – Token/Gist-ID prüfen.';
  }
  render(); // aktualisiert auch den dauerhaften Sync-Status im Header
}

async function pullFromGist(){
  if(!state.settings.syncToken || !state.settings.syncGistId) return false;
  syncStatus = 'saving';
  try{
    const result = await githubFetch(`https://api.github.com/gists/${state.settings.syncGistId}`, 'GET');
    const file = result.files && result.files[SYNC_FILENAME];
    if(!file) throw new Error('Sync-Datei nicht im Gist gefunden.');
    const parsed = JSON.parse(file.content);
    state.entries = parsed.entries || {};
    state.settings = Object.assign(state.settings, parsed.settings || {});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    syncStatus = 'ok';
    syncMessage = `Von Cloud geladen: ${new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})}`;
    return true;
  } catch(err){
    console.error('Sync-Fehler (Download):', err);
    syncStatus = 'error';
    syncMessage = 'Laden fehlgeschlagen – Token/Gist-ID prüfen.';
    return false;
  }
}

function syncBadgeText(){
  if(syncStatus === 'saving') return '☁ Synchronisiere …';
  if(syncStatus === 'error') return '☁ Sync-Fehler';
  if(syncStatus === 'ok' && syncMessage) return `☁ ${syncMessage}`;
  return '☁ Sync bereit';
}

async function fetchWeather(){
  weatherStatus = 'loading';
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=Europe%2FVienna&forecast_days=1`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`Wetter-API Fehler (${res.status})`);
    const data = await res.json();
    weatherData = {
      temp: data.current.temperature_2m,
      code: data.current.weather_code,
      high: data.daily.temperature_2m_max[0],
      low: data.daily.temperature_2m_min[0],
      precipChance: data.daily.precipitation_probability_max[0],
      sunrise: data.daily.sunrise[0],
      sunset: data.daily.sunset[0],
      uvIndex: data.daily.uv_index_max[0]
    };
    weatherStatus = 'ok';
  } catch(err){
    console.error('Wetter-Fehler:', err);
    weatherStatus = 'error';
  }
  render();
}

function fmtIsoTime(iso){
  if(!iso) return '–';
  const parts = iso.split('T');
  return parts.length > 1 ? parts[1] : iso;
}

function weatherCategory(code){
  if(code === 0) return 'clear';
  if(code === 1 || code === 2) return 'partly';
  if(code === 3) return 'cloudy';
  if(code === 45 || code === 48) return 'fog';
  if([51,53,55,56,57].includes(code)) return 'drizzle';
  if([61,63,65,66,67,80,81,82].includes(code)) return 'rain';
  if([71,73,75,77,85,86].includes(code)) return 'snow';
  if([95,96,99].includes(code)) return 'storm';
  return 'cloudy';
}

function weatherLabel(category){
  const map = {
    clear: 'Klar', partly: 'Heiter bis wolkig', cloudy: 'Bedeckt', fog: 'Neblig',
    drizzle: 'Nieselregen', rain: 'Regen', snow: 'Schnee', storm: 'Gewitter'
  };
  return map[category] || 'Bewölkt';
}

function weatherIconSvg(category){
  const sun = `<circle cx="14" cy="13" r="8" fill="#D9A441"/>`;
  const cloud = `<path d="M10 22 h16 a6 6 0 0 0 -1.5 -11.8 A8.5 8.5 0 0 0 8 15.5 A6 6 0 0 0 10 22 Z" fill="#4B4760"/>`;
  const rainDrops = `<line x1="13" y1="25" x2="11" y2="30" stroke="#7CA0D9" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="25" x2="17" y2="30" stroke="#7CA0D9" stroke-width="2" stroke-linecap="round"/><line x1="25" y1="25" x2="23" y2="30" stroke="#7CA0D9" stroke-width="2" stroke-linecap="round"/>`;
  const snowDots = `<circle cx="13" cy="27" r="1.4" fill="#EDEBF4"/><circle cx="19" cy="29" r="1.4" fill="#EDEBF4"/><circle cx="25" cy="27" r="1.4" fill="#EDEBF4"/>`;
  const bolt = `<path d="M18 22 l-4 7 h4 l-2 5 6 -8 h-4 z" fill="#D9A441"/>`;

  let inner;
  switch(category){
    case 'clear': inner = sun; break;
    case 'partly': inner = sun + cloud; break;
    case 'fog':
    case 'cloudy': inner = cloud; break;
    case 'drizzle':
    case 'rain': inner = cloud + rainDrops; break;
    case 'snow': inner = cloud + snowDots; break;
    case 'storm': inner = cloud + bolt; break;
    default: inner = cloud;
  }
  return `<svg width="34" height="34" viewBox="0 0 34 34" style="flex-shrink:0;">${inner}</svg>`;
}

function renderWeatherCard(){
  if(weatherStatus === 'error'){

/* ---------- Calculations ---------- */

function overallBalanceMinutes(){
  let total = Number(state.settings.startBalanceMinutes)||0;
  for(const [date, entry] of Object.entries(state.entries)){
    if(entry.type === 'work'){
      const w = workedMinutes(entry);
      if(w !== null){
        total += (w - sollMinutes(date));
      }
    } else if(entry.type === 'za'){
      total -= sollMinutes(date);
    }
  }
  return total;
}

function vacationYearBaseCounts(year){
  let used = 0, planned = 0;
  for(const [date, entry] of Object.entries(state.entries)){
    if(entry.type === 'urlaub' && date.startsWith(String(year))){
      if(date <= todayStr) used++; else planned++;
    }
  }
  const manual = Number((state.settings.vacationManualUsed||{})[year]) || 0;
  used += manual;
  return { used, planned };
}

function earliestTrackedYear(){
  let years = Object.keys(state.settings.vacationManualUsed||{}).map(Number);
  for(const [date, entry] of Object.entries(state.entries)){
    if(entry.type === 'urlaub') years.push(Number(date.slice(0,4)));
  }
  return years.length ? Math.min(...years) : todayObj.getFullYear();
}

function vacationYearlyOverview(){
  const startYear = earliestTrackedYear();
  let endYear = Math.max(todayObj.getFullYear() + 1, summaryYear);
  for(const key of Object.keys(state.settings.vacationManualUsed||{})){
    endYear = Math.max(endYear, Number(key));
  }
  for(const [date, entry] of Object.entries(state.entries)){
    if(entry.type === 'urlaub') endYear = Math.max(endYear, Number(date.slice(0,4)));
  }
  const allowance0 = Number(state.settings.vacationDaysPerYear)||0;
  const rows = [];
  let carry = 0;
  for(let y = startYear; y <= endYear; y++){
    const base = vacationYearBaseCounts(y);
    const allowance = allowance0 + carry;
    const remaining = allowance - base.used - base.planned;
    rows.push({ year: y, allowance, carryIn: carry, used: base.used, planned: base.planned, remaining });
    carry = remaining; // positiver Rest wird gutgeschrieben, negativer Rest abgezogen
  }
  return rows;
}

function vacationStats(year){
  const overview = vacationYearlyOverview();
  let row = overview.find(r => r.year === year);
  if(!row){
    const base = vacationYearBaseCounts(year);
    const allowance = Number(state.settings.vacationDaysPerYear)||0;
    row = { year, allowance, carryIn: 0, used: base.used, planned: base.planned, remaining: allowance - base.used - base.planned };
  }
  const manual = Number((state.settings.vacationManualUsed||{})[year]) || 0;
  return { used: row.used, planned: row.planned, remaining: row.remaining, allowance: row.allowance, carryIn: row.carryIn, manual };
}

function weekRangeContaining(date){
  const wd = weekdayMon0(date);
  const start = new Date(date);
  start.setDate(date.getDate() - wd);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { start, end };
}

function weekStats(startDate, endDate){
  let soll = 0, ist = 0, days = 0;
  const cur = new Date(startDate);
  while(cur <= endDate){
    const dateStr = fmtDate(cur);
    const entry = state.entries[dateStr];
    if(entry){
      if(entry.type === 'work'){
        const w = workedMinutes(entry);
        if(w !== null){
          soll += sollMinutes(dateStr);
          ist += w;
          days += 1;
        }
      } else if(entry.type === 'za'){
        soll += sollMinutes(dateStr);
        days += 1;
      }
    }
    cur.setDate(cur.getDate() + 1);
  }
  return { soll, ist, days, diff: ist - soll };
}

function weeksInMonth(year, month){
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const weeks = [];
  let cur = weekRangeContaining(first).start;
  while(cur <= last){
    const end = new Date(cur);
    end.setDate(cur.getDate() + 6);
    weeks.push({ start: new Date(cur), end: new Date(end) });
    cur.setDate(cur.getDate() + 7);
  }
  return weeks;
}

function monthlySummary(year){
  const months = Array.from({length:12}, ()=>({ soll:0, ist:0, days:0 }));
  for(const [date, entry] of Object.entries(state.entries)){
    if(!date.startsWith(String(year))) continue;
    const mIdx = parseDate(date).getMonth();
    if(entry.type === 'work'){
      const w = workedMinutes(entry);
      if(w === null) continue;
      months[mIdx].soll += sollMinutes(date);
      months[mIdx].ist += w;
      months[mIdx].days += 1;
    } else if(entry.type === 'za'){
      months[mIdx].soll += sollMinutes(date);
      months[mIdx].days += 1;
    }
  }
  return months.map((m, idx) => ({
    month: MONTH_NAMES[idx],
    days: m.days,
    soll: m.soll,
    ist: m.ist,
    diff: m.ist - m.soll
  }));
}

const QUARTER_LABELS = ['Jän–Mär','Apr–Jun','Jul–Sep','Okt–Dez'];

function quarterlySummary(year){
  const months = monthlySummary(year);
  return [0,1,2,3].map(q => {
    const slice = months.slice(q*3, q*3+3);
    const soll = slice.reduce((a,m)=>a+m.soll,0);
    const ist = slice.reduce((a,m)=>a+m.ist,0);
    const days = slice.reduce((a,m)=>a+m.days,0);
    return { label: `Q${q+1}`, range: QUARTER_LABELS[q], soll, ist, days, diff: ist - soll };
  });
}

function allTimeTotals(){
  let soll = 0, ist = 0, days = 0;
  for(const [date, entry] of Object.entries(state.entries)){
    if(entry.type === 'work'){
      const w = workedMinutes(entry);
      if(w === null) continue;
      soll += sollMinutes(date);
      ist += w;
      days += 1;
    } else if(entry.type === 'za'){
      soll += sollMinutes(date);
      days += 1;
    }
  }
  const diff = ist - soll;
  const startBal = Number(state.settings.startBalanceMinutes)||0;
  return { soll, ist, days, diff, diffWithStart: diff + startBal, startBal };
}

function renderBarChart(items){
  // items: [{ label, diff (Minuten), hasData }]
  const hasData = items.some(it => it.hasData);
  if(!hasData){
    return `<div class="empty">Für ${summaryYear} sind noch keine Arbeitstage erfasst.</div>`;
  }

  const W = 760, H = 240;
  const padTop = 28, padBottom = 28, padSide = 8;
  const chartH = H - padTop - padBottom;
  const baseline = padTop + chartH / 2;
  const halfH = chartH / 2 - 20;
  const maxAbsHours = Math.max(1, ...items.map(it => Math.abs(it.diff) / 60));
  const scale = halfH / maxAbsHours;
  const n = items.length;
  const gap = n > 6 ? 6 : 16;
  const barW = (W - padSide * 2 - gap * (n - 1)) / n;

  let bars = '';
  items.forEach((it, i) => {
    const hours = it.diff / 60;
    const h = Math.max(Math.abs(hours) * scale, (hours === 0 || !it.hasData) ? 0 : 2);
    const x = padSide + i * (barW + gap);
    const y = hours >= 0 ? baseline - h : baseline;
    const color = hours >= 0 ? 'var(--green)' : 'var(--red)';
    const cx = (x + barW/2).toFixed(1);

    let valueLabel = '';
    if(it.hasData){
      const labelY = hours >= 0 ? (y - 6) : (y + h + 14);
      valueLabel = `<text x="${cx}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" style="fill:${color}" font-family="'IBM Plex Mono', monospace">${fmtDuration(it.diff)}</text>`;
    }

    bars += `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:${color}">
        <title>${it.label}: ${fmtDuration(it.diff)}</title>
      </rect>
      ${valueLabel}
      <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-soft)" font-family="'IBM Plex Sans', sans-serif">${it.label}</text>
    `;
  });

  return `
    <div class="chart-card">
      <svg viewBox="0 0 ${W} ${H}" class="month-bar-chart" preserveAspectRatio="xMidYMid meet">
        <line x1="${padSide}" y1="${baseline.toFixed(1)}" x2="${W-padSide}" y2="${baseline.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
        ${bars}
      </svg>
      <div class="chart-legend">
        <span><span class="legend-dot legend-dot-pos"></span>Plusstunden</span>
        <span><span class="legend-dot legend-dot-neg"></span>Minusstunden</span>
      </div>
    </div>
  `;
}

function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7; // Mo=0..So=6
  date.setUTCDate(date.getUTCDate() - dayNum + 3); // Donnerstag dieser Woche
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((date - firstThursday) / (7*24*3600*1000));
}

function renderCalendarCells(){
  const first = new Date(viewYear, viewMonth, 1);
  const startOffset = weekdayMon0(first); // days before month start to fill
  const gridStart = new Date(viewYear, viewMonth, 1 - startOffset);

  let html = '';
  for(let w=0; w<6; w++){
    const weekStart = new Date(gridStart);
    weekStart.setDate(gridStart.getDate() + w*7);
    const kw = isoWeekNumber(weekStart);
    html += `<div class="cal-kw">KW ${kw}</div>`;

    for(let d=0; d<7; d++){
      const cellDate = new Date(weekStart);
      cellDate.setDate(weekStart.getDate() + d);
      const dateStr = fmtDate(cellDate);
      const inMonth = cellDate.getMonth() === viewMonth;
      const wd = weekdayMon0(cellDate);
      const isWeekend = wd >= 5;
      const entry = state.entries[dateStr];
      const holiday = !isWeekend ? holidayName(dateStr) : null;

      let classes = 'cal-cell';
      if(!inMonth) classes += ' other-month';
      if(isWeekend) classes += ' disabled';
      if(dateStr === todayStr) classes += ' today';
      if(dateStr === selectedDate) classes += ' selected';

      let inner = `<span class="cal-daynum">${cellDate.getDate()}</span>`;
      if(holiday){
        inner += `<span class="cal-tag feiertag" title="${holiday}">${holiday}</span>`;
      }
      if(entry){
        if(entry.type === 'urlaub'){
          inner += `<span class="cal-tag urlaub">Urlaub</span>`;
        } else if(entry.type === 'za'){
          inner += `<span class="cal-tag za">ZA −${fmtDurationPlain(sollMinutes(dateStr))}</span>`;
        } else if(entry.type === 'krank'){
          inner += `<span class="cal-tag krank">Krankenstand</span>`;
        } else if(entry.type === 'work'){
          const wm = workedMinutes(entry);
          if(wm !== null){
            const delta = wm - sollMinutes(dateStr);
            inner += `<span class="cal-time">${entry.start}–${entry.end}</span>`;
            inner += `<span class="cal-tag ${delta>=0?'work-pos':'work-neg'}">${fmtDuration(delta)}</span>`;
          }
        } else if(entry.type === 'note' && !entry.termin){
          inner += `<span class="cal-tag note-only" title="${escapeHtml(entry.note||'')}">Notiz</span>`;
        }
        if(entry.termin){
          inner += `<span class="cal-appt" title="${escapeHtml(entry.termin)}">${escapeHtml(entry.termin)}</span>`;
        }
        if(entry.note && entry.type !== 'note'){
          inner += `<span class="cal-note-dot" title="${escapeHtml(entry.note)}">📝</span>`;
        }
      }

      html += `<div class="${classes}" data-date="${dateStr}" data-clickable="${!isWeekend}">${inner}</div>`;
    }
  }
  return html;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderEditor(){

          </div>

function computeDefaultEnd(dateStr, startStr){
  const soll = sollMinutes(dateStr);
  const brk = 15;
  const s = timeToMin(startStr) ?? timeToMin(DEFAULT_START);
  const endMin = s + soll + brk;
  return `${pad(Math.floor(endMin/60)%24)}:${pad(endMin%60)}`;
}

      <div class="editor-actions">
        <button class="btn btn-primary" id="saveSyncSettings">Speichern & Hochladen</button>
        ${hasToken && hasGist ? `<button class="btn btn-ghost" id="pullSyncBtn">Von Cloud laden (überschreibt lokal)</button>` : ''}
      </div>
      ${syncMessage ? `<div class="pdf-hint ${syncStatus==='error' ? 'sync-error-text' : ''}">${escapeHtml(syncMessage)}</div>` : ''}
    </div>
  `;
}

function typeLabelFor(entry, dateStr, isWeekend, holiday){
  if(entry){
    if(entry.type === 'work') return 'Arbeitstag';
    if(entry.type === 'urlaub') return 'Urlaub';
    if(entry.type === 'za') return 'Zeitausgleich';
    if(entry.type === 'krank') return 'Krankenstand';
    if(entry.type === 'note') return entry.termin || 'Notiz';
  }
  if(holiday) return `Feiertag (${holiday})`;
  if(isWeekend) return 'Wochenende';
  return '–';
}

function buildPrintReportHtml(startStr, endStr){
  const start = parseDate(startStr);
  const end = parseDate(endStr);
  let rows = '';
  let totalSoll = 0, totalIst = 0, totalSaldo = 0;
  const cur = new Date(start);
  while(cur <= end){
    const dateStr = fmtDate(cur);
    const wd = weekdayMon0(cur);
    const isWeekend = wd >= 5;
    const holiday = holidayName(dateStr);
    const entry = state.entries[dateStr];
    const label = typeLabelFor(entry, dateStr, isWeekend, holiday);

    let zeit = '', soll = '', ist = '', saldo = '';
    if(entry && entry.type === 'work'){
      const s = sollMinutes(dateStr);
      const w = workedMinutes(entry);
      zeit = `${entry.start}–${entry.end}`;
      soll = fmtDurationPlain(s);
      if(w !== null){
        ist = fmtDurationPlain(w);
        saldo = fmtDuration(w - s);
        totalSoll += s; totalIst += w; totalSaldo += (w - s);
      }
    } else if(entry && entry.type === 'za'){
      const s = sollMinutes(dateStr);
      soll = fmtDurationPlain(s);
      saldo = fmtDuration(-s);
      totalSoll += s; totalSaldo += -s;
    }

    const noteParts = [];
    if(entry && entry.termin) noteParts.push(entry.termin);
    if(entry && entry.note) noteParts.push(entry.note);

    rows += `<tr>
      <td>${cur.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'})}</td>
      <td>${DAY_NAMES[wd]}</td>
      <td>${escapeHtml(label)}</td>
      <td>${zeit}</td>
      <td>${soll}</td>
      <td>${ist}</td>
      <td>${saldo}</td>
      <td>${escapeHtml(noteParts.join(' – '))}</td>
    </tr>`;
    cur.setDate(cur.getDate()+1);
  }

  const startLabel = start.toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' });
  const endLabel = end.toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' });

  return `
    <h1>Zeitsaldo – Auswertung</h1>
    <div class="print-meta">Für: ${escapeHtml(REPORT_NAME)}</div>
    <div class="print-meta">Zeitraum: ${startLabel} – ${endLabel} · Erstellt am ${todayObj.toLocaleDateString('de-AT')}</div>
    <table>
      <thead>
        <tr>
          <th>Datum</th><th>Tag</th><th>Typ</th><th>Zeit</th><th>Soll</th><th>Ist</th><th>Saldo</th><th>Notiz</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td colspan="4">Gesamt</td>
          <td>${fmtDurationPlain(totalSoll)}</td>
          <td>${fmtDurationPlain(totalIst)}</td>
          <td>${fmtDuration(totalSaldo)}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  `;
}

function exportPdf(){
  const startEl = document.getElementById('pdfStart');
  const endEl = document.getElementById('pdfEnd');
  const startStr = startEl ? startEl.value : '';
  const endStr = endEl ? endEl.value : '';
  if(!startStr || !endStr || startStr > endStr){
    alert('Bitte einen gültigen Zeitraum wählen (Von darf nicht nach Bis liegen).');
    return;
  }
  const html = buildPrintReportHtml(startStr, endStr);
  let container = document.getElementById('printArea');
  if(!container){
    container = document.createElement('div');
    container.id = 'printArea';
    document.body.appendChild(container);
  }
  container.innerHTML = html;
  window.print();
  setTimeout(() => { container.innerHTML = ''; }, 500);
}

/* ---------- Event handling ---------- */

let timerIntervalId = null;

function updateLiveTimer(){
  const el = document.getElementById('liveTimer');
  if(!el){
    if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
    return;
  }
  const targetMin = Number(el.dataset.target);
  const now = new Date();
  const nowSeconds = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
  const targetSeconds = targetMin*60;
  const diff = targetSeconds - nowSeconds;
  const fmtHMS = (secs) => {
    const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
    return `${h}:${pad(m)}:${pad(s)}`;
  };
  if(diff > 0){
    el.textContent = `Noch ${fmtHMS(diff)} bis Feierabend`;
    el.classList.remove('timer-over');
  } else {
    el.textContent = `Feierabend erreicht · +${fmtHMS(-diff)}`;
    el.classList.add('timer-over');
  }
}

function attachHandlers(){
  const settingsToggle = document.getElementById('settingsToggle');
  if(settingsToggle) settingsToggle.onclick = () => { settingsOpen = !settingsOpen; pdfExportOpen = false; syncOpen = false; render(); };

  const pdfToggle = document.getElementById('pdfToggle');
  if(pdfToggle) pdfToggle.onclick = () => { pdfExportOpen = !pdfExportOpen; settingsOpen = false; syncOpen = false; render(); };

  const syncToggle = document.getElementById('syncToggle');
  if(syncToggle) syncToggle.onclick = () => { syncOpen = !syncOpen; settingsOpen = false; pdfExportOpen = false; render(); };

  const punchBtn = document.getElementById('punchBtn');
  if(punchBtn) punchBtn.onclick = async () => {
    const now = new Date();
    const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const existing = state.entries[todayStr];
    const entry = (existing && existing.type === 'work') ? { ...existing } : { type: 'work', breakMin: 15 };
    if(!entry.start){
      entry.start = timeStr;
    } else if(!entry.end){
      entry.end = timeStr;
    }
    state.entries[todayStr] = entry;
    await saveState();
  };

  const punchEditBtn = document.getElementById('punchEditToday');
  if(punchEditBtn) punchEditBtn.onclick = () => {
    selectedDate = todayStr;
    editorDraft = null;
    editorNoteDraft = null;
    editorTerminDraft = null;
    render();
    setTimeout(() => {
      const panel = document.getElementById('editorPanel');
      if(panel) panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }, 0);
  };

  const generatePdfBtn = document.getElementById('generatePdf');
  if(generatePdfBtn) generatePdfBtn.onclick = () => exportPdf();

  const saveSyncBtn = document.getElementById('saveSyncSettings');
  if(saveSyncBtn) saveSyncBtn.onclick = async () => {
    const token = document.getElementById('syncToken').value.trim();
    const gistId = document.getElementById('syncGistId').value.trim();
    state.settings.syncToken = token || undefined;
    state.settings.syncGistId = gistId || undefined;
    await saveState();
  };

  const pullSyncBtn = document.getElementById('pullSyncBtn');
  if(pullSyncBtn) pullSyncBtn.onclick = async () => {
    if(confirm('Lokale Daten mit dem Stand aus der Cloud überschreiben?')){
      const ok = await pullFromGist();
      render();
    }
  };

  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');
  if(prevBtn) prevBtn.onclick = () => { viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} render(); };
  if(nextBtn) nextBtn.onclick = () => { viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} render(); };

  const jumpTodayBtn = document.getElementById('jumpToday');
  if(jumpTodayBtn) jumpTodayBtn.onclick = () => {
    viewYear = todayObj.getFullYear();
    viewMonth = todayObj.getMonth();
    render();
  };

  const prevSY = document.getElementById('prevSummaryYear');
  const nextSY = document.getElementById('nextSummaryYear');
  if(prevSY) prevSY.onclick = () => { summaryYear--; render(); };
  if(nextSY) nextSY.onclick = () => { summaryYear++; render(); };

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      activeTab = btn.dataset.tab;
      render();
      const el = document.querySelector(`.tab-btn[data-tab="${activeTab}"]`);
      if(el) el.focus();
    };
  });
  const tabsBar = document.getElementById('tabsBar');
  if(tabsBar) tabsBar.onkeydown = (e) => {
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const idx = TABS.findIndex(t => t.id === activeTab);
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    activeTab = TABS[(idx + dir + TABS.length) % TABS.length].id;
    render();
    const el = document.querySelector(`.tab-btn[data-tab="${activeTab}"]`);
    if(el) el.focus();
  };

  document.querySelectorAll('.cal-cell').forEach(cell => {
    if(cell.dataset.clickable === 'true'){
      cell.onclick = () => {
        selectedDate = cell.dataset.date;
        editorDraft = null;
        editorNoteDraft = null;
        editorTerminDraft = null;
        render();
        setTimeout(()=>{
          const panel = document.getElementById('editorPanel');
          if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 0);
      };
    }
  });

  document.querySelectorAll('.segmented button').forEach(btn => {
    btn.onclick = () => {
      const entry = state.entries[selectedDate] || {};
      const noteEl = document.getElementById('fNote');
      if(noteEl) editorNoteDraft = noteEl.value;
      const terminEl = document.getElementById('fTermin');
      if(terminEl) editorTerminDraft = terminEl.value;
      editorDraft = {
        mode: btn.dataset.mode,
        start: (editorDraft && editorDraft.start) || entry.start || DEFAULT_START,
        end: (editorDraft && editorDraft.end) || entry.end || computeDefaultEnd(selectedDate, entry.start || DEFAULT_START),
        breakMin: (editorDraft && editorDraft.breakMin) || (entry.breakMin !== undefined ? entry.breakMin : 15)
      };
      render();
    };
  });

  const saveBtn = document.getElementById('saveEntry');
  if(saveBtn) saveBtn.onclick = async () => {
    const existingEntry = state.entries[selectedDate];
    const mode = editorDraft ? editorDraft.mode : (existingEntry && existingEntry.type !== 'note' ? existingEntry.type : null);
    const noteVal = document.getElementById('fNote').value.trim();
    const terminVal = document.getElementById('fTermin').value.trim();
    const noteField = noteVal ? { note: noteVal } : {};
    const terminField = terminVal ? { termin: terminVal } : {};
    if(mode === 'urlaub'){
      state.entries[selectedDate] = { type: 'urlaub', ...noteField, ...terminField };
    } else if(mode === 'za'){
      state.entries[selectedDate] = { type: 'za', ...noteField, ...terminField };
    } else if(mode === 'krank'){
      state.entries[selectedDate] = { type: 'krank', ...noteField, ...terminField };
    } else if(mode === 'work'){
      const start = document.getElementById('fStart').value;
      const end = document.getElementById('fEnd').value;
      const breakMin = Number(document.getElementById('fBreak').value)||0;
      if(!start || !end){
        alert('Bitte Beginn und Ende angeben.');
        return;
      }
      state.entries[selectedDate] = { type: 'work', start, end, breakMin, ...noteField, ...terminField };
    } else {
      // Kein Tagestyp gewählt: nur Termin/Notiz speichern, keine Arbeitszeiten
      if(noteVal || terminVal){
        state.entries[selectedDate] = { type: 'note', ...noteField, ...terminField };
      } else {
        delete state.entries[selectedDate];
      }
    }
    editorDraft = null;
    editorNoteDraft = null;
    editorTerminDraft = null;
    selectedDate = null;
    await saveState();
  };

  const delBtn = document.getElementById('deleteEntry');
  if(delBtn) delBtn.onclick = async () => {
    delete state.entries[selectedDate];
    editorDraft = null;
    editorNoteDraft = null;
    editorTerminDraft = null;
    selectedDate = null;
    await saveState();
  };

  const cancelBtn = document.getElementById('cancelEntry');
  if(cancelBtn) cancelBtn.onclick = () => { selectedDate = null; editorDraft = null; editorNoteDraft = null; editorTerminDraft = null; render(); };

  document.querySelectorAll('.entry-remove').forEach(btn => {
    btn.onclick = async () => {
      delete state.entries[btn.dataset.date];
      await saveState();
    };
  });

  const saveSettingsBtn = document.getElementById('saveSettings');
  if(saveSettingsBtn) saveSettingsBtn.onclick = async () => {
    const vacDays = Number(document.getElementById('sVacDays').value)||0;
    const startBalHours = Number(document.getElementById('sStartBalance').value)||0;
    state.settings.vacationDaysPerYear = vacDays;
    state.settings.startBalanceMinutes = Math.round(startBalHours*60);
    settingsOpen = false;
    await saveState();
  };

  const saveManualUsedBtn = document.getElementById('saveManualUsed');
  if(saveManualUsedBtn) saveManualUsedBtn.onclick = async () => {
    const val = Number(document.getElementById('manualUsedInput').value)||0;
    if(!state.settings.vacationManualUsed) state.settings.vacationManualUsed = {};
    state.settings.vacationManualUsed[summaryYear] = val;
    await saveState();
  };

  const exportBtn = document.getElementById('exportData');
  if(exportBtn) exportBtn.onclick = () => {
    const { syncToken, syncGistId, ...safeSettings } = state.settings;
    const exportState = { settings: safeSettings, entries: state.entries };
    const blob = new Blob([JSON.stringify(exportState, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zeitkonto-backup-${todayStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importBtn = document.getElementById('importDataBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn && importFile) importBtn.onclick = () => importFile.click();
  if(importFile) importFile.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const keepToken = state.settings.syncToken;
      const keepGistId = state.settings.syncGistId;
      state = Object.assign(defaultState(), parsed);
      state.settings = Object.assign(defaultState().settings, parsed.settings||{});
      state.entries = parsed.entries || {};
      if(keepToken) state.settings.syncToken = keepToken;
      if(keepGistId) state.settings.syncGistId = keepGistId;
      await saveState();
    } catch(err){
      console.error('Fehler beim Importieren:', err);
      alert('Die Datei konnte nicht gelesen werden. Bitte eine gültige Export-Datei auswählen.');
    }
    importFile.value = '';
  };

  const resetBtn = document.getElementById('resetAll');
  if(resetBtn) resetBtn.onclick = async () => {
    if(confirm('Wirklich alle Einträge und Einstellungen löschen? Das kann nicht rückgängig gemacht werden.')){
      state = defaultState();
      await saveState();
    }
  };

  if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
  if(document.getElementById('liveTimer')){
    updateLiveTimer();
    timerIntervalId = setInterval(updateLiveTimer, 1000);
  }
}

/* ---------- Init ---------- */

(async function init(){
  viewYear = todayObj.getFullYear();
  viewMonth = todayObj.getMonth();
  summaryYear = todayObj.getFullYear();
  const migrated = await loadState();
  if(state.settings.syncToken && state.settings.syncGistId){
    await pullFromGist();
  }
  if(migrated){ await saveState(); } else { render(); }
  fetchWeather();
})();
</script>
